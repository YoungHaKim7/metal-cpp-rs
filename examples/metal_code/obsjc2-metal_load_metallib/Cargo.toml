[package]
name = "obsjc2-metal_load_metallib"
version = "0.1.0"
edition = "2024"

[dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSError", "NSData"] }
objc2-metal = { version = "0.3", features = [
    "MTLDevice",
    "MTLLibrary",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLBuffer",
    "MTLResource",
    "MTLTypes",
] }

