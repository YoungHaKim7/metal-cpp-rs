[package]
name = "metal-cpp-rs"
version = "0.1.1"
edition = "2024"
rust-version = "1.100.1"
description = "ABI-faithful Rust conversion of Apple's metal-cpp: raw Objective-C runtime FFI for Metal, Foundation and QuartzCore (macOS 27 / iOS 27 SDK era)"
license = "Apache-2.0"
repository = "https://github.com/YoungHaKim7/metal-cpp-rs"
documentation = "https://docs.rs/metal-cpp-rs"
keywords = ["metal", "apple", "objc", "ffi", "gpu"]
categories = ["api-bindings", "os::macos-apis"]

[dependencies]
# Intentionally empty — this crate talks to the Objective-C runtime through its
# raw ABI (objc_msgSend / objc_msgSend_stret / objc_msgSend_fpret), exactly the
# way metal-cpp does. Zero third-party dependencies.
